name: gGit CI

# The fork's own check on every pull request and push to dev: the tests of
# the crates this fork changes, on the one platform it ships. Upstream's
# workflow (ci.yml) builds, benchmarks and tests every platform; it is
# disabled on this fork (Actions > CI > Disable workflow), which leaves the
# file as upstream has it.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ggit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Debug info makes the test build far slower and nothing reads it.
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # rust-toolchain.toml's channel.
          toolchain: "1.98"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ggit-windows-test

      - name: Unit tests
        run: cargo test --locked -p gitcomet-ui-gpui -p gitcomet-state -p gitcomet-core --lib

      # Against real git and a bare remote: pushes, upstreams, fetches.
      - name: Git integration tests
        run: cargo test --locked -p gitcomet-git-gix --test upstream_integration
