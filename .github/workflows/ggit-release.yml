name: gGit Release

# The fork's own build: one optimized gitcomet.exe per version tag, published
# as a GitHub Release that the app's update check (update_check.rs) finds.
# Upstream's pipeline (build-release-artifacts.yml) signs through Azure and
# builds every platform; this fork has none of those secrets and needs one exe.
#
# Releasing: bump `version` under [workspace.package] in Cargo.toml, commit,
# then push a matching tag (`git tag v0.3.0 && git push origin v0.3.0`).
# Run it by hand (Actions > gGit Release > Run workflow) for a test build: the
# zip is kept on the run as an artifact and nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ggit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # The release profile's fat LTO with one codegen unit is tuned for
      # upstream's official builds and runs far longer on the UI crate. Thin
      # LTO over 16 units builds much faster for a nearly identical app.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          # A mismatch would have every copy of this build offer itself as
          # an update forever.
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match workspace version $version"
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # rust-toolchain.toml's channel.
          toolchain: "1.98"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ggit-windows-release

      - name: Build
        run: cargo build --release --locked -p gitcomet

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $label = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          New-Item -ItemType Directory -Path dist\gGit -Force | Out-Null
          Copy-Item target\release\gitcomet.exe dist\gGit\gitcomet.exe
          Copy-Item README.md, LICENSE-AGPL-3.0, NOTICE dist\gGit\
          $zip = "dist\gGit-$label-windows-x86_64.zip"
          Compress-Archive -Path dist\gGit\* -DestinationPath $zip -Force
          "ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gGit-windows-x86_64
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:ZIP --repo $env:GITHUB_REPOSITORY --title "gGit $env:GITHUB_REF_NAME" --generate-notes
